<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RC Cars</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; background: #f5f5f5; }
    h1 { text-align: center; }
    .car { background: #fff; padding: 14px; margin: 10px 0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .car h3 { margin: 0 0 6px; }
    .car p { margin: 2px 0; color: #444; }
  </style>
</head>
<body>
  <h1>🏎️ RC Cars Store</h1>
  <div id="cars">Loading...</div>

  <script>
    fetch("/api/cars")
      .then(r => r.json())
      .then(cars => {
        document.getElementById("cars").innerHTML = cars.map(c => `
          <div class="car">
            <h3>${c.name}</h3>
            <p>Type: ${c.type}</p>
            <p>Top speed: ${c.speed}</p>
            <p>Price: $${c.price}</p>
          </div>`).join("");
      })
      .catch(() => document.getElementById("cars").textContent = "Failed to load cars.");
  </script>
</body>
</html>
